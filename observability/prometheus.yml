global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API
  - job_name: 'orchestrator-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # AI Planner Service
  - job_name: 'ai-planner'
    static_configs:
      - targets: ['ai-planner:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Governance Service
  - job_name: 'governance'
    static_configs:
      - targets: ['governance:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Executor Service
  - job_name: 'executor'
    static_configs:
      - targets: ['executor:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
